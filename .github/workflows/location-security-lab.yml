name: Location Security Lab

on:
  push:
    branches:
      - location-security-lab
    paths:
      - "location-security-lab/**"
      - ".github/workflows/location-security-lab.yml"
  pull_request:
    paths:
      - "location-security-lab/**"
      - ".github/workflows/location-security-lab.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: location-security-lab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q
