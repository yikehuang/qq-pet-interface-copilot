name: Compatibility

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile sources
        run: >-
          python -m py_compile main.py
          qqpet_app/client.py
          qqpet_app/config.py
          qqpet_app/scheduler.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

  protocol-host:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: protocol-host/go.mod
          cache-dependency-path: protocol-host/go.sum

      - name: Test and build Android QQ protocol host
        shell: pwsh
        run: |
          Push-Location protocol-host
          go test ./...
          go build -trimpath -o QQPetProtocolHost.exe .
          Pop-Location
